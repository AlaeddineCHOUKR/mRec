model: genrec
split: test
k: 10
seqlen: 30
n_users: 500          # beam decoding is per-request; a reduced cohort for the first pass
batch_size: 64
model_params:
  tokenizer: residual_kmeans
  tokenizer_params: {n_levels: 3, codebook_size: 256, seed: 0}
  collision_policy: extra_token
  embeddings: svd
  beam_width: 32
  model: {embedding_dim: 128, seqlen: 30, num_blocks: 2, num_heads: 2, dropout: 0.1}
  training: {lr: 0.001, batch_size: 256, epochs: 15, device: cuda}
  n_valid_users: 500
